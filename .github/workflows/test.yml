name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run tests
        run: |
          if [ -f "pytest.ini" ] || [ -f "pyproject.toml" ]; then
            python -m pytest || true
          elif [ -d "tests" ]; then
            python -m pytest tests/ || true
          else
            echo "No test suite found — placeholder workflow active"
          fi
