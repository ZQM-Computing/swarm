name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run tests
        run: |
          if [ -f "pytest.ini" ] || [ -f "pyproject.toml" ]; then
            python -m pytest || true
          elif [ -d "tests" ]; then
            python -m pytest tests/ || true
          else
            echo "No test suite found — placeholder workflow active"
          fi
